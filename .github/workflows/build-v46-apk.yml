name: Build V46 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Reassemble V46 project ZIP
        run: |
          cat AnimeAscensionV46.zip.part* > AnimeAscensionProjectV46_CombatFluidityImpact.zip
          unzip -t AnimeAscensionProjectV46_CombatFluidityImpact.zip

      - name: Extract project
        run: |
          mkdir V46Project
          unzip AnimeAscensionProjectV46_CombatFluidityImpact.zip -d V46Project
          ls -la V46Project

      - name: Build debug APK
        working-directory: V46Project
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Find APK
        run: |
          find V46Project -name "*.apk" -type f -print

      - name: Upload V46 APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeAscension-V46-APK
          path: V46Project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
