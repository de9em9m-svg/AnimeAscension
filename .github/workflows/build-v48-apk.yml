name: Build V48 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Reassemble V48 project ZIP
        run: |
          cat AnimeAscensionV48.zip.part* > AnimeAscensionProjectV48_SmartAutoCombat.zip
          unzip -t AnimeAscensionProjectV48_SmartAutoCombat.zip

      - name: Extract project
        run: |
          mkdir V48Project
          unzip AnimeAscensionProjectV48_SmartAutoCombat.zip -d V48Project
          ls -la V48Project

      - name: Build debug APK
        working-directory: V48Project
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Find APK
        run: |
          find V48Project -name "*.apk" -type f -print

      - name: Upload V48 APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeAscension-V48-APK
          path: V48Project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
