name: Reassemble V46 Project

on:
  workflow_dispatch:
  push:
    paths:
      - 'AnimeAscensionV46.zip.part*'
      - '.github/workflows/reassemble-v46.yml'

jobs:
  reassemble:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble V46 ZIP
        run: cat AnimeAscensionV46.zip.part* > AnimeAscensionProjectV46_CombatFluidityImpact.zip

      - name: Verify ZIP
        run: unzip -t AnimeAscensionProjectV46_CombatFluidityImpact.zip

      - name: Upload reconstructed V46 project
        uses: actions/upload-artifact@v4
        with:
          name: AnimeAscensionProjectV46_CombatFluidityImpact
          path: AnimeAscensionProjectV46_CombatFluidityImpact.zip
          retention-days: 30
