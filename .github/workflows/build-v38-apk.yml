name: Build V38 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Reassemble V38 project ZIP
        run: |
          cat AnimeAscensionV38.zip.part* > AnimeAscensionProjectV38_Premium2DHD.zip
          unzip -t AnimeAscensionProjectV38_Premium2DHD.zip

      - name: Extract project
        run: |
          mkdir V38Project
          unzip AnimeAscensionProjectV38_Premium2DHD.zip -d V38Project
          ls -la V38Project

      - name: Build debug APK
        working-directory: V38Project
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Find APK
        run: |
          find V38Project -name "*.apk" -type f -print

      - name: Upload V38 APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeAscension-V38-APK
          path: V38Project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
