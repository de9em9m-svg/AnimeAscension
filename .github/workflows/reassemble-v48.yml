name: Reassemble V48 Project

on:
  workflow_dispatch:
  push:
    paths:
      - 'AnimeAscensionV48.zip.part*'
      - '.github/workflows/reassemble-v48.yml'

jobs:
  reassemble:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble V48 ZIP
        run: cat AnimeAscensionV48.zip.part* > AnimeAscensionProjectV48_SmartAutoCombat.zip

      - name: Verify ZIP
        run: unzip -t AnimeAscensionProjectV48_SmartAutoCombat.zip

      - name: Upload reconstructed V48 project
        uses: actions/upload-artifact@v4
        with:
          name: AnimeAscensionProjectV48_SmartAutoCombat
          path: AnimeAscensionProjectV48_SmartAutoCombat.zip
          retention-days: 30
