name: Build V54 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reassemble V54
        run: |
          cat AnimeAscensionV54.zip.part* > AnimeAscensionProjectV54_CombatPolish.zip
          unzip -t AnimeAscensionProjectV54_CombatPolish.zip

      - name: Extract V54
        run: |
          mkdir V54Project
          unzip AnimeAscensionProjectV54_CombatPolish.zip -d V54Project

      - name: Build V54 APK
        working-directory: V54Project
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload V54 APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeAscension-V54-APK
          path: V54Project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
